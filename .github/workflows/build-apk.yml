name: Build HealthyPlate APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Test APK for your phone: includes the "Turn on Pro for testing" switch
      - name: Build test APK
        run: gradle --no-daemon assembleRelease -PtestUnlock=true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HealthyPlateSA.apk

      # Play Store bundle: real Google Play payments only, no test switch
      - name: Build Play Store bundle (AAB)
        run: gradle --no-daemon bundleRelease -PtestUnlock=false

      - name: Rename AAB
        run: cp app/build/outputs/bundle/release/app-release.aab HealthyPlateSA-PlayStore.aab

      - name: Upload files (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: HealthyPlateSA-builds
          path: |
            HealthyPlateSA.apk
            HealthyPlateSA-PlayStore.aab

      - name: Publish downloads (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HealthyPlate SA v1.2 build ${{ github.run_number }}
          body: |
            **HealthyPlateSA.apk** - install on your Android phone for testing (includes "Turn on Pro for testing" in Profile).
            **HealthyPlateSA-PlayStore.aab** - upload this to Google Play Console (real payments only).
          files: |
            HealthyPlateSA.apk
            HealthyPlateSA-PlayStore.aab
