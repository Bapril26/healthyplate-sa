name: Build HealthyPlate APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HealthyPlateSA.apk

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: HealthyPlateSA-APK
          path: HealthyPlateSA.apk

      - name: Publish APK as a download (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: HealthyPlate SA test build ${{ github.run_number }}
          body: Install HealthyPlateSA.apk on your Android phone. You may need to allow "Install unknown apps" for your browser.
          files: HealthyPlateSA.apk
