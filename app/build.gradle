plugins {
    id 'com.android.application'
}

android {
    namespace 'za.co.fusionlabs.healthyplate'
    compileSdk 34

    defaultConfig {
        applicationId 'za.co.fusionlabs.healthyplate'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Test builds are signed with the debug key so they install directly.
            // Replace with your own upload key before publishing on Google Play.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
